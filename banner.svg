<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="GCS Settings: browser ground station for RFD900 radios">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15233d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <!-- radio waves -->
  <g transform="translate(1060 160)" fill="none" stroke="url(#accent)" stroke-linecap="round">
    <circle r="10" fill="#60a5fa" stroke="none"/>
    <path d="M-34 -34A48 48 0 0 1 34 -34" stroke-width="6" opacity="0.95"/>
    <path d="M-62 -62A88 88 0 0 1 62 -62" stroke-width="6" opacity="0.7"/>
    <path d="M-90 -90A128 128 0 0 1 90 -90" stroke-width="6" opacity="0.45"/>
    <path d="M-34 34A48 48 0 0 0 34 34" stroke-width="6" opacity="0.95"/>
    <path d="M-62 62A88 88 0 0 0 62 62" stroke-width="6" opacity="0.7"/>
    <path d="M-90 90A128 128 0 0 0 90 90" stroke-width="6" opacity="0.45"/>
  </g>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="72" y="140" font-size="64" font-weight="700" fill="#f8fafc">GCS Settings</text>
    <rect x="74" y="164" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="214" font-size="26" fill="#cbd5e1">Browser ground station for RFD900 radios and the ESP32 ground station</text>
    <text x="72" y="256" font-size="20" fill="#94a3b8">Single-file · No install · Works offline · No tracking</text>
  </g>
</svg>
